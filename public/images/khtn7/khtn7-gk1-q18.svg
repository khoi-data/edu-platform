<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <!-- Background -->
  <rect width="340" height="340" fill="#0f172a" rx="16"/>
  
  <!-- Outer shell (layer 3) -->
  <circle cx="170" cy="170" r="140" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Middle shell (layer 2) -->
  <circle cx="170" cy="170" r="100" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Inner shell (layer 1) -->
  <circle cx="170" cy="170" r="60" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Nucleus -->
  <circle cx="170" cy="170" r="34" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="163" text-anchor="middle" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="bold">13p</text>
  <text x="170" y="181" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif" font-weight="bold">14n</text>
  
  <!-- Layer 1 electrons (2e) -->
  <circle cx="170" cy="110" r="6" fill="#38bdf8"/>
  <circle cx="170" cy="230" r="6" fill="#38bdf8"/>
  
  <!-- Layer 2 electrons (8e) -->
  <circle cx="170" cy="70" r="6" fill="#38bdf8"/>
  <circle cx="170" cy="270" r="6" fill="#38bdf8"/>
  <circle cx="70" cy="170" r="6" fill="#38bdf8"/>
  <circle cx="270" cy="170" r="6" fill="#38bdf8"/>
  <circle cx="99" cy="99" r="6" fill="#38bdf8"/>
  <circle cx="241" cy="99" r="6" fill="#38bdf8"/>
  <circle cx="99" cy="241" r="6" fill="#38bdf8"/>
  <circle cx="241" cy="241" r="6" fill="#38bdf8"/>
  
  <!-- Layer 3 electrons (3e) -->
  <circle cx="170" cy="30" r="6" fill="#38bdf8"/>
  <circle cx="291" cy="240" r="6" fill="#38bdf8"/>
  <circle cx="49" cy="240" r="6" fill="#38bdf8"/>
</svg>
