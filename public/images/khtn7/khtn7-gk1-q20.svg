<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="220" fill="#0f172a" rx="16"/>

  <!-- Atom A -->
  <g transform="translate(100, 95)">
    <!-- Shell 2 (outer: radius 70) -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Shell 1 (inner: radius 40) -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="24" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">6p</text>
    <text x="0" y="11" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="bold">6n</text>
    <!-- Shell 1 (2e) -->
    <circle cx="0" cy="-40" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="40" r="5" fill="#38bdf8"/>
    <!-- Shell 2 (4e) -->
    <circle cx="0" cy="-70" r="5" fill="#38bdf8"/>
    <circle cx="70" cy="0" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="70" r="5" fill="#38bdf8"/>
    <circle cx="-70" cy="0" r="5" fill="#38bdf8"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="sans-serif" font-weight="bold">A</text>
  </g>

  <!-- Atom B -->
  <g transform="translate(300, 95)">
    <!-- Shell 2 (outer: radius 70) -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Shell 1 (inner: radius 40) -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="24" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">7p</text>
    <text x="0" y="11" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="bold">7n</text>
    <!-- Shell 1 (2e) -->
    <circle cx="0" cy="-40" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="40" r="5" fill="#38bdf8"/>
    <!-- Shell 2 (5e) -->
    <circle cx="0" cy="-70" r="5" fill="#38bdf8"/>
    <circle cx="66" cy="-21" r="5" fill="#38bdf8"/>
    <circle cx="41" cy="56" r="5" fill="#38bdf8"/>
    <circle cx="-41" cy="56" r="5" fill="#38bdf8"/>
    <circle cx="-66" cy="-21" r="5" fill="#38bdf8"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="sans-serif" font-weight="bold">B</text>
  </g>

  <!-- Atom D -->
  <g transform="translate(500, 95)">
    <!-- Shell 2 (outer: radius 70) -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Shell 1 (inner: radius 40) -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="24" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">6p</text>
    <text x="0" y="11" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="bold">8n</text>
    <!-- Shell 1 (2e) -->
    <circle cx="0" cy="-40" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="40" r="5" fill="#38bdf8"/>
    <!-- Shell 2 (4e) -->
    <circle cx="0" cy="-70" r="5" fill="#38bdf8"/>
    <circle cx="70" cy="0" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="70" r="5" fill="#38bdf8"/>
    <circle cx="-70" cy="0" r="5" fill="#38bdf8"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="sans-serif" font-weight="bold">D</text>
  </g>
</svg>
